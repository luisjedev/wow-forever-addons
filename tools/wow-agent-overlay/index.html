<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Matches the Forever addon frames in this repo (TDL/GuildStock): bronze frame, dark stone, WoW yellow. */
  :root { --yellow: #ffd100; --text: #f1ece0; --muted: #a39780; --line: #6b5531; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--text);
    font: 13px/1.45 "Friz Quadrata TT", "Optima", "Avenir Next", sans-serif; }
  .frame {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    /* Slices measured on TDL/Assets/Window.tga (1024px), drawn at 0.36 scale. */
    border-style: solid; border-width: 46px 29px 29px 29px;
    border-image: url(frame.png) 128 80 80 80 / 46px 29px 29px 29px stretch;
    background: linear-gradient(rgba(8,6,4,.78), rgba(8,6,4,.86)), url(background.png) center / cover, #0c0a07;
    background-clip: padding-box;
  }
  .title {
    position: absolute; top: 11px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 1;
    color: var(--yellow); font-size: 15px; letter-spacing: .6px; text-shadow: 1px 1px 1px #000;
  }
  .btn-x {
    position: absolute; top: 12px; width: 20px; height: 22px; padding: 0; cursor: pointer; border-radius: 3px;
    border: 1px solid #c9a43c; box-shadow: inset 0 0 0 1px #000, 0 1px 2px #000;
    color: var(--yellow); font: bold 13px/1 Arial, sans-serif; text-shadow: 1px 1px 0 #000;
  }
  .close { right: 34px; background: radial-gradient(circle at 40% 35%, #c8241b, #5e0a06); }
  .reset { right: 58px; background: radial-gradient(circle at 40% 35%, #3a3326, #14110b); }
  .btn-x:hover { filter: brightness(1.35); }
  #log { flex: 1; overflow-y: auto; padding: 4px 6px 8px 2px; display: flex; flex-direction: column; gap: 6px; }
  #log::-webkit-scrollbar { width: 7px; }
  #log::-webkit-scrollbar-thumb { background: #4c3e26; border: 1px solid #8a6d38; border-radius: 4px; }
  .msg { padding: 6px 9px; white-space: pre-wrap; word-wrap: break-word; user-select: text; }
  .user { align-self: flex-end; max-width: 85%; color: var(--yellow); background: rgba(255,209,0,.06);
    border: 1px solid #3d3220; border-radius: 3px; }
  .agent { background: rgba(60,46,20,.35); border-left: 3px solid var(--yellow); }
  .agent b { color: var(--yellow); font-weight: normal; }
  .agent code, .agent pre { font: 11.5px Menlo, monospace; color: #e8dcc0; background: rgba(0,0,0,.45); border-radius: 2px; }
  .agent code { padding: 0 3px; }
  .agent pre { padding: 6px; overflow-x: auto; white-space: pre; border: 1px solid #2c2416; }
  .note { font-size: 11.5px; color: var(--muted); padding: 0 4px; }
  .error { color: #ff5a4a; }
  /* The art's divider sits at 25.4% of the stretched edge above the bottom border: the composer fills that band. */
  form { position: relative; display: flex; gap: 6px; height: calc((100vh - 75px) * 0.2537); padding: 9px 0 2px;
    border-top: 1px solid #c08a36; }
  form::before { content: ""; position: absolute; top: -4px; left: 50%; width: 6px; height: 6px; margin-left: -3px;
    transform: rotate(45deg); background: #e0aa4a; border: 1px solid #5a3b10; }
  textarea {
    flex: 1; resize: none; padding: 6px 9px; outline: none; border-radius: 4px;
    background: #050403; color: var(--text); border: 1px solid #5a4a32; box-shadow: inset 0 1px 3px #000; font: inherit;
  }
  textarea::placeholder { color: #6f6553; }
  textarea:focus { border-color: #9c7c3c; }
  .send {
    align-self: flex-end; height: 30px; min-width: 70px; padding: 0 12px; cursor: pointer; border-radius: 4px; font: 13px "Friz Quadrata TT", Optima, sans-serif;
    color: var(--yellow); text-shadow: 1px 1px 0 #000;
    background: linear-gradient(#a3160f, #6a0905 55%, #4a0603); border: 1px solid #2b0503;
    box-shadow: inset 0 1px 0 rgba(255,140,110,.35), 0 0 0 1px #6b5531;
  }
  .send:hover { filter: brightness(1.2); }
  .send:disabled { filter: grayscale(1) brightness(.55); cursor: default; }
</style>
</head>
<body>
<div class="title">Murly</div>
<div class="frame">
  <div id="log"><div class="note">Mrrglll! Ask about the game, your addons or the interface. Enter sends, Shift+Enter adds a line.</div></div>
  <form id="f">
    <textarea id="t" placeholder="Speak, adventurer…"></textarea>
    <button class="send" id="b">Send</button>
  </form>
</div>
<button class="btn-x reset" title="New conversation" onclick="post('reset'); clearLog()">↺</button>
<button class="btn-x close" title="Close (Esc)" onclick="post('close')">✕</button>
<script>
const log = document.getElementById('log'), t = document.getElementById('t'), b = document.getElementById('b');
let busy = false;
const post = (type, extra = {}) => window.webkit.messageHandlers.host.postMessage({ type, ...extra });

function add(cls, text, html = false) {
  const d = document.createElement('div');
  d.className = cls;
  html ? d.innerHTML = text : d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
// Just enough markdown for code and bold; the rest stays plain text.
const md = s => esc(s)
  .replace(/```\w*\n?([\s\S]*?)```/g, '<pre>$1</pre>')
  .replace(/`([^`\n]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');

function setBusy(v) { busy = v; b.disabled = v; b.textContent = v ? '…' : 'Send'; }
function clearLog() { log.innerHTML = ''; setBusy(false); }
function focusInput() { t.focus(); }

function toolSummary(u) {
  const i = u.input || {};
  const what = i.command || i.file_path || i.pattern || i.query || i.url || i.skill || '';
  return `⚙ ${u.name}${what ? ': ' + String(what).slice(0, 80) : ''}`;
}

function onClaude(line) {
  let e;
  try { e = JSON.parse(line); } catch { return add('note', line); }
  if (e.type === 'assistant') {
    for (const c of e.message?.content || []) {
      if (c.type === 'text' && c.text.trim()) add('msg agent', md(c.text), true);
      if (c.type === 'tool_use') add('note', toolSummary(c));
    }
  } else if (e.type === 'result') {
    setBusy(false);
    for (const d of e.permission_denials || []) add('note error', `✋ Not allowed without approval: ${d.tool_name}`);
    if (e.is_error) add('note error', e.result || e.subtype || 'Error');
  } else if (e.type === 'exited') {
    setBusy(false);
    add('note error', e.error || 'Session ended; the next message starts a new one.');
  }
}

document.getElementById('f').onsubmit = ev => {
  ev.preventDefault();
  const text = t.value.trim();
  if (!text || busy) return;
  add('msg user', text);
  t.value = '';
  setBusy(true);
  post('send', { text });
};
t.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); document.getElementById('f').requestSubmit(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') post('close'); });
</script>
</body>
</html>
