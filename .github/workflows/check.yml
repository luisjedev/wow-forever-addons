name: Check addons

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: lua5.1 -e 'for _, p in ipairs({"TDL/Locales.lua", "TDL/TDL.lua", "TDL/TDL.test.lua", "Revenge/Locales.lua", "Revenge/Revenge.lua", "Revenge/Revenge.test.lua", "tests/minimap.test.lua", "GuildStock/Locales.lua", "GuildStock/GuildStock.lua", "GuildStock/Probe.lua", "GuildStock/Sync.lua", "GuildStock/Sync.test.lua", "GuildStock/ItemNames.lua", "GuildStock/CatalogSeed.lua", "GuildStock/CatalogSeed.test.lua", "GuildStock/Catalog.lua", "GuildStock/Bags.lua", "GuildStock/Bags.test.lua", "GuildStock/UI.lua", "GuildStock/GuildStock.test.lua"}) do assert(loadfile(p)) end'
      - name: Check TDL interface logic
        run: lua5.1 TDL/TDL.test.lua
      - name: Check Revenge logic
        working-directory: Revenge
        run: lua5.1 Revenge.test.lua
      - name: Check minimap controls
        run: lua5.1 tests/minimap.test.lua
      - name: Check GuildStock prototype
        run: lua5.1 GuildStock/GuildStock.test.lua
      - name: Check GuildStock native bag hints
        run: lua5.1 GuildStock/Bags.test.lua
      - name: Check GuildStock bundled catalog
        run: lua5.1 GuildStock/CatalogSeed.test.lua
      - name: Check GuildStock automatic synchronization
        run: lua5.1 GuildStock/Sync.test.lua
